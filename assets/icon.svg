<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="dsh-wetype-voice icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203A"/>
      <stop offset="0.55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07C160"/>
      <stop offset="1" stop-color="#3BE08A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- glow pad behind the microphone -->
  <circle cx="256" cy="248" r="104" fill="#07C160" opacity="0.10"/>
  <circle cx="256" cy="248" r="72" fill="#07C160" opacity="0.10"/>

  <!-- microphone -->
  <g fill="none" stroke="#F7FAFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <rect x="206" y="128" width="100" height="176" rx="50"/>
    <path d="M176 244v16a80 80 0 0 0 160 0v-16"/>
    <path d="M256 340v40"/>
  </g>
  <path d="M212 388h88" stroke="#F7FAFF" stroke-width="20" stroke-linecap="round"/>

  <!-- sound waves -->
  <g fill="none" stroke="url(#mint)" stroke-linecap="round" filter="url(#glow)">
    <path d="M446 208a56 56 0 0 1 0 80" stroke-width="16" opacity="0.95"/>
    <path d="M474 182a96 96 0 0 1 0 132" stroke-width="13" opacity="0.55"/>
    <path d="M66 208a56 56 0 0 0 0 80" stroke-width="16" opacity="0.95"/>
    <path d="M38 182a96 96 0 0 0 0 132" stroke-width="13" opacity="0.55"/>
  </g>
</svg>
